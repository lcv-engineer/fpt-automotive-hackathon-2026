name: carsky-deploy-asr

# Đổi image container `viva-asr` trên CarSky và xác minh nó trở lại Running.
#
# ## HAI CHẾ ĐỘ — `restart` nhanh nhưng KHÔNG chắc áp được image mới
#
#   mode=restart   PATCH image -> POST restart/{node} -> chờ node Running
#   mode=recreate  PATCH image -> DELETE deployment  -> POST deployment mới
#                                -> chờ TOÀN BỘ node Running
#
# `restart` là mặc định vì bán kính ảnh hưởng nhỏ (một container). Nhưng nó có
# một lỗ hổng đã đo được, và đây là lý do `recreate` tồn tại:
#
# `POST /deployments/{room}/restart/{node}` chỉ chạy lại pod **theo spec K8s hiện
# có** — nó không đọc lại blueprint. Pod lên lại vẫn mang image **cũ**, trong khi
# blueprint đã ghi image mới và mọi bước verify đều xanh. Tức là job báo thành
# công mà **không đổi gì**. Nút `Redeploy` trong Deployment Viewer đáng lẽ là thứ
# vá chỗ này, nhưng đã thử 3 lần đều trả `Partial redeploy: 1 node(s) failed` và
# không lộ lý do (runbook §2, §4).
#
# Cách duy nhất đã chứng minh áp được image mới là **xoá deployment rồi dựng
# lại**: cùng blueprint, cùng image `0.2.1`, dựng deployment mới -> ASR `Running`
# sau 9 giây. Đó là `mode=recreate`.
#
# ## 🔴 `recreate` XOÁ SẠCH MÁY ẢO ANDROID — đọc trước khi bấm
#
# `DELETE /deployments/{roomId}` không chỉ tắt container. Nó **huỷ cả VM
# Android**, node skycraft boot lại từ artifact gốc. Mất hết:
#
#   - APK đã cài (phải cài lại tay qua widget `IVI ADB` — không tự động được)
#   - Cấu hình mạng `eth1` (chỉ nằm trong RAM)
#   - Mọi thiết lập trong app, gồm **ngôn ngữ giọng nói** -> app quay về tiếng
#     Anh, Vosk nạp `model-en-us`, mọi câu tiếng Việt sai bét
#
# Tức chạy `recreate` là ký nhận ~20-30 phút thao tác tay sau đó, và room không
# dùng được trong lúc ấy. **Đừng chạy trong giờ tổng duyệt.** Vì thế nó đòi gõ
# đúng room id vào ô `confirm_room` — không có cách bấm nhầm.
#
# Muốn không gián đoạn: dựng trước một deployment thứ hai trên device khác
# (`VIVA (Copy)` = `wcmfnwigjse4hv9r8s0e3`), xác nhận đủ node Running, rồi mới
# recreate cái cũ. Quota `MAX_CONCURRENT_DEPLOYMENTS=2` cho phép đúng hai.
#
# ## ⚠️ `openapi.json` ghi SAI đường dẫn PATCH — đừng lấy path từ đó
#
# Bản đầu của file này PATCH vào `/api/v1/nodes/{nodeId}`, lấy từ `openapi.json`.
# Gọi thật 07/08 trả **404 Route not found**, và điều đó từng bị kết luận nhầm
# thành "CarSky không cho đổi image bằng API".
#
# Sai. `Car-Sky-Platform.html` (tài liệu vận hành chính thức, mục "API & MCP
# Tools") ghi đường dẫn thật có thêm tiền tố `/blueprints`:
#
#   PATCH /api/v1/nodes/{nodeId}              -> 404   (openapi.json — SAI)
#   PATCH /api/v1/blueprints/nodes/{nodeId}   -> 200   (tài liệu — ĐÚNG)
#
# Đã dò bằng body rỗng `{}` nên không ghi gì, và kiểm lại sau đó: config nguyên
# vẹn. Bài học: `openapi.json` của CarSky khai sai cả địa chỉ, không chỉ khai
# thừa endpoint. Đối chiếu với tài liệu người viết trước khi tin.
#
# Cùng lớp lỗi này, `docs/backend-docs/carsky-api.md` §10 kết luận "pin ETHERNET
# chỉ tạo được trong web UI" dựa trên `POST /nodes/{nodeId}/pins` -> 404. Đường
# thật nhiều khả năng là `POST /api/v1/blueprints/nodes/{nodeId}/pins` — CHƯA
# THỬ, vì thêm pin là thao tác ghi không dò khan được.
#
# ## `restart/{node}` trả 500 nhưng VẪN CHẠY — đừng tin mã HTTP
#
# Đo 08/08: `POST /deployments/{room}/restart/{node}` trả **500, body rỗng**, mà
# node vẫn chuyển `Provisioning` ngay sau đó rồi `Running` sau ~50 giây. Lệnh có
# tác dụng; chỉ mã trả về là sai.
#
# Bản trước dùng `curl -f` nên coi 500 là thất bại → step fail → rollback chạy →
# PATCH đè image cũ lên bản mới **vừa ghi thành công**. Deploy tự huỷ chính nó.
#
# Nên mọi phán xét ở đây dựa vào **hệ quả quan sát được** (phase của node đổi),
# không dựa vào lời khai của server. Bước verify vì thế có hai giai đoạn: chờ
# node RỜI `Running` (chứng minh restart thật sự xảy ra), rồi mới chờ nó quay
# lại. Thiếu giai đoạn một thì một lệnh restart không ăn gì sẽ trông y hệt một
# lần deploy thành công.
#
# ## Vì sao không có bước "Redeploy" ở đây
#
# Tài liệu mục 3.7 "Khi nào cần redeploy": *đổi artifact/image dùng trong node*
# và *cấu hình node thay đổi* đều thuộc nhóm PHẢI redeploy. Mà **redeploy không
# có endpoint REST** — đã grep cả `openapi.json`, không có redeploy/reconcile/
# sync/apply. Nó chỉ là nút trong Deployment Viewer, và nút đó đã fail 3/3 lần.
#
# Nên workflow không gọi được redeploy, và cũng không nên đợi nó: `mode=recreate`
# đạt cùng kết quả bằng hai lệnh REST có thật. Nếu chạy `mode=restart` mà ASR vẫn
# hành xử như bản cũ thì đừng bấm Redeploy — chạy lại với `mode=recreate`.
#
# ⚠️ Blueprint có cờ `Locked` để chống sửa nhầm lúc đang demo. Bật khoá thì bước
# PATCH sẽ fail — đó là có chủ đích, đừng gỡ khoá giữa buổi duyệt.
#
# ## Vì sao KHÔNG phải `on: push`
#
# Room này là môi trường demo dùng chung, và quota nền tảng là
# MAX_CONCURRENT_DEPLOYMENTS = 2. Một workflow chạy theo mỗi lần merge sẽ khởi
# động lại container giữa lúc đang tổng duyệt. Chạy tay trước; khi đã trơn vài
# lần thì đổi trigger là một dòng.
#
# ## Vì sao vẫn phải là digest, không phải tag
#
# Node `VIVA ASR` ghim image bằng **digest**:
#
#   registry.hackathon-2.carsky.io/viva/viva-asr@sha256:63c2c56a...
#
# Push đè lên một tag rồi restart sẽ kéo lại đúng image cũ — pipeline chạy mà
# không đổi gì. Đổi image trong UI cũng phải dán digest, đừng dán tag.
#
# ## Cái workflow này KHÔNG làm được
#
# Cài APK lên node Android. Cần `adb`, mà họ endpoint điều khiển VM chưa dùng
# được (xem docs/backend-docs/carsky-api.md §4). Đây là CD cho **service ASR**,
# không phải CD cho app — đừng gọi nhầm tên trong báo cáo.
#
# Hệ quả cay nhất: `mode=recreate` **phá** thứ nó không dựng lại được. Nó xoá VM
# Android rồi để đó, còn việc cài lại APK và khôi phục `eth1` thì con người phải
# làm tay. Job in checklist ở step summary — đừng đóng tab trước khi làm xong.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image đầy đủ, NÊN dùng dạng digest (registry.hackathon-2.carsky.io/viva/viva-asr@sha256:...)"
        required: true
        type: string
      room_id:
        description: "Room đang chạy"
        required: true
        default: "v37aa3knc6t1embelr5yi"
        type: string
      node_id:
        description: "Node VIVA ASR trong blueprint"
        required: true
        default: "b8eada00-d137-4fdc-a131-2197b1d1356b"
        type: string
      mode:
        # restart  = nhẹ, một container, KHÔNG chắc áp được image mới
        # recreate = chắc chắn áp được, nhưng XOÁ VM Android (APK + eth1 + cài đặt app)
        description: "restart (nhẹ, có thể không áp được image mới) | recreate (chắc chắn, XOÁ VM Android)"
        required: true
        default: "restart"
        type: choice
        options:
          - restart
          - recreate
      confirm_room:
        # Chốt chặn duy nhất trước một thao tác không hoàn tác được. Cố ý bắt gõ
        # lại room id thay vì tick một ô: tick nhầm rất dễ, gõ nhầm 21 ký tự thì
        # không. Chỉ đọc khi mode=recreate.
        description: "CHỈ cho recreate: gõ lại room id để xác nhận sẽ xoá VM Android"
        required: false
        default: ""
        type: string
      deployment_name:
        description: "Tên deployment mới (bỏ trống = tự sinh viva-asr-<ngày>-<run>)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Chỉ in ra thay đổi sẽ làm, không gọi PATCH/restart/DELETE"
        required: true
        default: true
        type: boolean

# Hai lần chạy chồng nhau lên cùng một room sẽ đua nhau PATCH rồi restart, và
# bản lùi của lần này có thể ghi đè bản mới của lần kia.
concurrency:
  group: carsky-deploy-asr-${{ inputs.room_id }}
  cancel-in-progress: false

env:
  BASE: https://hackathon-2.carsky.io/api/v1
  REGISTRY: registry.hackathon-2.carsky.io

jobs:
  deploy:
    name: PATCH digest + ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kiểm secret
        run: |
          if [ -z "${{ secrets.CARSKY_API_KEY }}" ]; then
            echo "::error::Thiếu secret CARSKY_API_KEY. Thêm ở Settings → Secrets → Actions."
            exit 1
          fi

      - name: chặn image lạ
        run: |
          # Workflow này PATCH thẳng vào blueprint của room demo. Một image trỏ
          # sai registry là đường ngắn nhất để node kẹt ở ImagePullBackOff giữa
          # buổi duyệt, nên từ chối sớm thay vì để nền tảng phát hiện.
          case "${{ inputs.image }}" in
            ${{ env.REGISTRY }}/*) ;;
            *) echo "::error::image phải bắt đầu bằng ${{ env.REGISTRY }}/"; exit 1 ;;
          esac
          case "${{ inputs.image }}" in
            *@sha256:*) ;;
            *) echo "::warning::Đang dùng tag chứ không phải digest. Tag là con trỏ động — bản deploy sẽ không lặp lại được." ;;
          esac

      - name: chốt chặn cho recreate
        if: ${{ inputs.mode == 'recreate' && !inputs.dry_run }}
        run: |
          # `DELETE /deployments` là thao tác KHÔNG hoàn tác được: nó huỷ VM
          # Android cùng APK, cấu hình eth1 và mọi thiết lập trong app. Không có
          # snapshot, không có undo. Nên nó phải khó bấm nhầm hơn mọi bước khác
          # trong file này.
          if [ "${{ inputs.confirm_room }}" != "${{ inputs.room_id }}" ]; then
            echo "::error::confirm_room không khớp room_id. Gõ đúng '${{ inputs.room_id }}' để xác nhận xoá VM Android."
            exit 1
          fi
          echo "::warning::mode=recreate — VM Android của room ${{ inputs.room_id }} sẽ bị xoá. APK và cấu hình eth1 phải cài lại tay."

      - name: đọc trạng thái hiện tại
        id: current
        run: |
          set -euo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'

          # Blueprint id lấy từ deployment chứ không hardcode: room từng được
          # dựng lại bằng một blueprint clone khác, và một id chép cứng sẽ PATCH
          # nhầm vào bản không chạy — im lặng, không lỗi.
          #
          # Lưu ý tham số tên là `device` nhưng nhận đúng room id. Đừng dùng
          # CARSKY_DEVICE_ID trong backend/.env: giá trị ở đó là VIVA 2, không
          # phải room demo, và find sẽ trả về [].
          FIND=$(curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/find?device=$ROOM")
          BP=$(echo "$FIND" | jq -r '.[0].blueprintId // empty')
          if [ -z "$BP" ]; then
            echo "::error::Không tìm thấy deployment nào cho room $ROOM"
            exit 1
          fi

          NODE=$(curl -fsS -H "x-api-key: $KEY" "$BASE/blueprints/$BP" \
                 | jq -c --arg id '${{ inputs.node_id }}' '.nodes[] | select(.id == $id)')
          if [ -z "$NODE" ]; then
            echo "::error::Blueprint $BP không có node ${{ inputs.node_id }}"
            exit 1
          fi

          OLD_IMAGE=$(echo "$NODE" | jq -r '.config.image // empty')
          # Config đầy đủ, để bước PATCH trộn chứ không ghi đè — xem đầu file.
          echo "$NODE" | jq -c '.config' > /tmp/config-old.json

          # Số node đang chạy, đọc TRƯỚC khi đụng vào gì. `recreate` cần con số
          # này để biết khi nào deployment mới lên đủ.
          #
          # ĐẾM chứ không chép cứng "22": blueprint 6deadb05 có 22 node, bản
          # RMbeXxTF trước đó có 21. Chép cứng thì đổi blueprint là job chờ mãi
          # một con số không bao giờ tới, hoặc tệ hơn, báo xanh khi còn thiếu.
          NODES=$(curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/$ROOM/nodes")
          TOTAL=$(echo "$NODES" | jq 'length')
          RUNNING=$(echo "$NODES" | jq '[.[] | select(.phase == "Running")] | length')
          echo "Node hiện tại: $RUNNING/$TOTAL Running"
          if [ "$RUNNING" != "$TOTAL" ]; then
            echo "::warning::Room chưa lành trước khi bắt đầu ($RUNNING/$TOTAL). Cân nhắc dừng lại."
          fi

          echo "blueprint=$BP"        >> "$GITHUB_OUTPUT"
          echo "old_image=$OLD_IMAGE" >> "$GITHUB_OUTPUT"
          echo "total_nodes=$TOTAL"   >> "$GITHUB_OUTPUT"

          {
            echo "### Trạng thái trước khi đổi"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| chế độ | \`${{ inputs.mode }}\` |"
            echo "| room | \`$ROOM\` |"
            echo "| blueprint | \`$BP\` |"
            echo "| node | \`${{ inputs.node_id }}\` ($(echo "$NODE" | jq -r .label)) |"
            echo "| image trên node | \`$OLD_IMAGE\` |"
            echo "| image mong đợi | \`${{ inputs.image }}\` |"
            echo "| node đang chạy | $RUNNING/$TOTAL |"
            echo ""
            echo "Config hiện tại của node:"
            echo ""
            echo '```json'
            jq . /tmp/config-old.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: dừng ở đây nếu dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true — không ghi gì."
          {
            echo ""
            echo "### Sẽ làm gì nếu chạy thật"
            echo ""
            if [ "${{ inputs.mode }}" = "recreate" ]; then
              echo "1. \`PATCH /blueprints/nodes/{node}\` — đổi image, giữ nguyên env"
              echo "2. \`DELETE /deployments/{room}\` — 🔴 **huỷ cả VM Android**"
              echo "3. \`POST /deployments\` — dựng lại từ blueprint"
              echo "4. chờ toàn bộ node Running (~3 phút, skycraft chậm nhất)"
              echo "5. **người làm tay:** cài lại APK + khối lệnh mạng eth1 + chọn lại ngôn ngữ giọng nói"
              echo ""
              echo "Chạy lại với \`dry_run=false\` **và** \`confirm_room=\` đúng room id để áp dụng."
            else
              echo "1. \`PATCH /blueprints/nodes/{node}\` — đổi image, giữ nguyên env"
              echo "2. \`POST /deployments/{room}/restart/{node}\` — chỉ container ASR"
              echo "3. chờ node rời rồi quay lại Running"
              echo ""
              echo "⚠️ \`restart\` không đọc lại blueprint — pod có thể lên lại với image **cũ**"
              echo "mà job vẫn xanh. Nếu ASR hành xử như bản cũ, chạy lại với \`mode=recreate\`."
              echo ""
              echo "Chạy lại với \`dry_run=false\` để áp dụng."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PATCH image của node
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Trộn: giữ nguyên env và mọi khoá khác, chỉ thay `image`. Gửi mỗi
          # `image` có thể ghi đè cả object và xoá sạch ASR_DEVICE /
          # ASR_MODEL_NAME / ASR_COMPUTE_TYPE — ASR sẽ khởi động với model mặc
          # định mà không báo lỗi.
          jq -c --arg img '${{ inputs.image }}' '.image = $img' /tmp/config-old.json > /tmp/config-new.json
          jq -n --slurpfile c /tmp/config-new.json '{config: $c[0]}' > /tmp/patch.json

          curl -fsS -X PATCH "$BASE/blueprints/nodes/${{ inputs.node_id }}" \
            -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @/tmp/patch.json > /tmp/patch-response.json
          echo "PATCH xong."

          # Đọc lại từ server thay vì tin mã 200: PATCH có thể nhận body rồi
          # lưu khác đi. Ba biến env là thứ mất đi âm thầm nhất nên đếm luôn.
          NEW=$(curl -fsS -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
                "$BASE/blueprints/${{ steps.current.outputs.blueprint }}" \
                | jq -c --arg id '${{ inputs.node_id }}' '.nodes[] | select(.id == $id) | .config')
          GOT_IMG=$(echo "$NEW" | jq -r '.image // empty')
          GOT_ENV=$(echo "$NEW" | jq -r '.env | length')
          WANT_ENV=$(jq -r '.env | length' /tmp/config-old.json)
          if [ "$GOT_IMG" != "${{ inputs.image }}" ]; then
            echo "::error::PATCH tra 200 nhung image tren server van la: $GOT_IMG"; exit 1
          fi
          if [ "$GOT_ENV" != "$WANT_ENV" ]; then
            echo "::error::So bien env doi tu $WANT_ENV thanh $GOT_ENV — config bi ghi de"; exit 1
          fi
          echo "Da xac minh: image doi dung, env con $GOT_ENV bien."

      - name: restart node
        if: ${{ !inputs.dry_run && inputs.mode == 'restart' }}
        run: |
          set -uo pipefail
          # Chỉ node này, KHÔNG phải `POST /deployments/{room}/restart` (cả room).
          # Bán kính ảnh hưởng là một container thay vì 22 node.
          #
          # ⚠️ KHÔNG dùng `curl -f` ở đây. Đo 08/08: endpoint này trả **500 với
          # body rỗng NHƯNG VẪN THỰC THI** — node chuyển Provisioning ngay sau
          # đó rồi Running sau ~50s. Với `-f`, curl coi 500 là lỗi, step fail,
          # rollback chạy và PATCH đè image cũ lên bản mới vừa ghi thành công.
          # Tức workflow tự huỷ việc của chính nó vì tin vào mã HTTP.
          #
          # Nên: ghi lại mã, không phán xét ở đây. Bước sau phán xét bằng HỆ QUẢ
          # quan sát được (phase đổi), không bằng lời khai của server.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                 -X POST "$BASE/deployments/${{ inputs.room_id }}/restart/${{ inputs.node_id }}" \
                 -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
                 -H "Content-Length: 0")
          echo "restart tra HTTP $CODE (500 la binh thuong o API nay)"
          case "$CODE" in
            2*|500) ;;
            *) echo "::warning::Ma la: $CODE — van di tiep, buoc verify se quyet dinh." ;;
          esac

      - name: chờ node Running trở lại
        id: verify
        if: ${{ !inputs.dry_run && inputs.mode == 'restart' }}
        run: |
          set -uo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          phase_now() {
            curl -fsS -H "x-api-key: $KEY" \
              "$BASE/deployments/${{ inputs.room_id }}/nodes" \
              | jq -r --arg id '${{ inputs.node_id }}' '.[] | select(.name == $id) | .phase'
          }

          # `name` trong /nodes KHONG phai luon la UUID cua node.
          #
          #   blueprint 6deadb05 (08/08) : name = "b8eada00-d137-..."  <- UUID
          #   blueprint RMbeXxTF (truoc) : name = "rmbexxtf5zvk...-n1" <- slug
          #
          # Bang chung: evidence/carsky/signals-rest-0808/00-nodes-live.json va
          # backend/carsky/nodes.json. Neu room duoc dung lai bang blueprint tra
          # ve dang slug thi select() khong khop gi va phase_now tra RONG — khi
          # do giai doan 1 "pass" ngay lap tuc vi rong != Running, roi giai doan
          # 2 cho du 300s va bao mot loi sai hoan toan nguyen nhan.
          #
          # Nen kiem mot lan truoc, va noi thang neu khong khop.
          if [ -z "$(phase_now)" ]; then
            echo "::error::Khong tim thay node ${{ inputs.node_id }} trong /deployments/${{ inputs.room_id }}/nodes."
            echo "Truong .name o day co the la slug (<blueprint>-nN) thay vi UUID. Kiem bang:"
            echo "  curl -H \"x-api-key: \$KEY\" $BASE/deployments/${{ inputs.room_id }}/nodes | jq '.[].name'"
            exit 1
          fi

          # GIAI DOAN 1 — xac nhan restart THAT SU xay ra.
          #
          # Bo qua buoc nay thi mot lenh restart khong an gi se trong y het mot
          # lan deploy thanh cong: node chua bao gio roi Running, vong doi ben
          # duoi thay "Running" ngay lap tuc va bao xanh. Do la kieu hong te
          # nhat — bao cao thanh cong ma khong doi gi.
          LEFT=no
          D1=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "$D1" ]; do
            P=$(phase_now); echo "cho roi Running... phase=$P"
            if [ "$P" != "Running" ]; then LEFT=yes; break; fi
            sleep 5
          done

          if [ "$LEFT" = "no" ]; then
            echo "::error::Node khong he roi trang thai Running trong 90s — lenh restart KHONG an gi."
            echo "left_running=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # GIAI DOAN 2 — cho no quay lai.
          DEADLINE=$(( $(date +%s) + 300 ))
          PHASE=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            PHASE=$(phase_now); echo "phase=$PHASE"
            [ "$PHASE" = "Running" ] && break
            sleep 10
          done
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          if [ "$PHASE" != "Running" ]; then
            echo "::error::Node khong tro lai Running (phase cuoi: $PHASE)"
            exit 1
          fi
          {
            echo ""
            echo "### Node đã Running"
            echo ""
            echo "⚠️ **Chưa chắc nó đang chạy image MỚI.** \`restart/{node}\` chạy lại pod"
            echo "theo spec K8s hiện có, không đọc lại blueprint — pod có thể lên lại với"
            echo "image cũ trong khi bước này vẫn xanh."
            echo ""
            echo "Kiểm bằng log của chính container (đây là bằng chứng, không phải phase):"
            echo ""
            echo '```bash'
            echo "curl -fsS -H \"x-api-key: \$KEY\" \\"
            echo "  \"$BASE/deployments/${{ inputs.room_id }}/logs/${{ inputs.node_id }}?container=user&tail=20\" | jq -r '.lines[]'"
            echo '```'
            echo ""
            echo "Dòng \`VIVA_ASR model ready ... : <model>\` phải khớp model của image mới."
            echo "Nếu vẫn là bản cũ → chạy lại workflow với **\`mode=recreate\`**."
            echo "Đừng bấm \`Redeploy\` trong UI: đã thử 3/3 lần đều \`Partial redeploy: 1 node(s) failed\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: xoá deployment rồi dựng lại
        id: recreate
        if: ${{ !inputs.dry_run && inputs.mode == 'recreate' }}
        run: |
          set -uo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'
          BP='${{ steps.current.outputs.blueprint }}'
          TOTAL='${{ steps.current.outputs.total_nodes }}'
          NAME='${{ inputs.deployment_name }}'
          [ -n "$NAME" ] || NAME="viva-asr-$(date -u +%m%d)-${{ github.run_number }}"

          # `BP` doc tu buoc `current`, tuc TRUOC khi xoa. Bat buoc: sau DELETE
          # thi `find?device=` tra [] va khong con duong nao lay lai blueprint id
          # cua room — job se dung giua chung voi room TRONG. Do la trang thai
          # xau nhat co the roi vao.
          if [ -z "$BP" ]; then
            echo "::error::Khong co blueprint id — tu choi xoa deployment."
            exit 1
          fi

          echo "== DELETE /deployments/$ROOM"
          # Khong `-f`: ho endpoint nay tung tra 500 ma van thuc thi (xem dau
          # file). Ghi lai ma, phan xet bang he qua o vong doi ben duoi.
          DC=$(curl -s -o /tmp/delete-resp.txt -w "%{http_code}" \
               -X DELETE "$BASE/deployments/$ROOM" -H "x-api-key: $KEY")
          echo "DELETE tra HTTP $DC"; cat /tmp/delete-resp.txt || true

          # He qua can quan sat: room khong con deployment. `/status` tra 404
          # hoac trang thai roi RUNNING.
          GONE=no
          D=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$D" ]; do
            SC=$(curl -s -o /tmp/status.json -w "%{http_code}" \
                 -H "x-api-key: $KEY" "$BASE/deployments/$ROOM/status")
            ST=$(jq -r '.status // .phase // empty' /tmp/status.json 2>/dev/null || echo "")
            echo "cho deployment bien mat... http=$SC status=$ST"
            if [ "$SC" = "404" ] || [ "$ST" = "DELETED" ] || [ "$ST" = "NOT_FOUND" ]; then
              GONE=yes; break
            fi
            sleep 5
          done
          if [ "$GONE" != "yes" ]; then
            echo "::error::Deployment cu khong bien mat sau 180s. KHONG POST de tranh dung hai deployment len cung room."
            exit 1
          fi

          echo "== POST /deployments  blueprint=$BP name=$NAME"
          PC=$(curl -s -o /tmp/post-resp.json -w "%{http_code}" \
               -X POST "$BASE/deployments" \
               -H "x-api-key: $KEY" -H "Content-Type: application/json" \
               -d "$(jq -nc --arg b "$BP" --arg r "$ROOM" --arg n "$NAME" \
                     '{blueprintId:$b, roomId:$r, name:$n}')")
          echo "POST tra HTTP $PC"; cat /tmp/post-resp.json || true
          case "$PC" in
            2*) ;;
            *) echo "::error::POST /deployments tra $PC — room dang TRONG. Xem buoc lui phia duoi."; exit 1 ;;
          esac

          # Thoi gian thuc do 08/08 (runbook §2): 20s -> Provisioning,
          # 60s -> 21/22, 180s -> 22/22. Node skycraft (VM Android) boot cham
          # nhat. Deadline 420s de con bien cho may cham hon binh thuong.
          DEADLINE=$(( $(date +%s) + 420 ))
          RUN=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            NODES=$(curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/$ROOM/nodes" 2>/dev/null || echo "[]")
            RUN=$(echo "$NODES" | jq '[.[] | select(.phase == "Running")] | length')
            NOW=$(echo "$NODES" | jq 'length')
            echo "$RUN/$NOW Running (mong doi $TOTAL)"
            [ "$RUN" = "$TOTAL" ] && break
            sleep 15
          done
          echo "running=$RUN" >> "$GITHUB_OUTPUT"
          if [ "$RUN" != "$TOTAL" ]; then
            echo "::error::Chi $RUN/$TOTAL node Running sau 420s."
            curl -fsS -H "x-api-key: $KEY" "$BASE/deployments/$ROOM/nodes" \
              | jq -r '.[] | select(.phase != "Running") | "  \(.displayName): \(.phase) \(.message // "")"' || true
            exit 1
          fi
          echo "Deployment moi len du $TOTAL node."

      - name: việc phải làm tay sau recreate
        if: ${{ !inputs.dry_run && inputs.mode == 'recreate' && steps.recreate.outcome == 'success' }}
        run: |
          # Day KHONG phai trang tri. VM Android vua boot lai tu artifact goc —
          # room "xanh" nhung app thi khong co tren may. Ai doc log ma bo qua
          # doan nay se tuong deploy da xong.
          {
            echo ""
            echo "### ✅ Deployment mới đã lên đủ node"
            echo ""
            echo "🔴 **Chưa xong.** VM Android đã boot lại từ artifact gốc — mất APK, mất"
            echo "cấu hình \`eth1\`, mất thiết lập trong app. Ba việc sau phải làm tay,"
            echo "không có đường tự động (\`adb-exec\`/\`container-exec\` vẫn 502 Conduit):"
            echo ""
            echo "**1. Khôi phục mạng** — widget \`IVI ADB\` → part \`face-adb\`, dán TỪNG dòng:"
            echo ""
            echo '```sh'
            echo "su 0 sh"
            echo "ip addr add 10.99.0.14/24 dev eth1"
            echo "ip link set eth1 up"
            echo "ip rule add to 10.99.0.0/24 lookup main priority 100"
            echo "exit"
            echo "curl -s -m 5 http://10.99.0.3:8080/health"
            echo '```'
            echo ""
            echo "Dòng \`ip rule\` là mấu chốt — thiếu nó thì root gọi được mà app thì timeout."
            echo "Phải kiểm bằng user thường (sau \`exit\`), vì Android định tuyến theo UID."
            echo ""
            echo "**2. Cài lại APK** — tải từ artifact private \`viva-apk\`, dùng đường dẫn tuyệt đối:"
            echo ""
            echo '```sh'
            echo "curl -L -o /data/local/tmp/viva.apk <URL>"
            echo "pm install -r /data/local/tmp/viva.apk"
            echo "pm grant com.sopa.viva_automotive.mock android.permission.RECORD_AUDIO"
            echo '```'
            echo ""
            echo "Gặp \`INSTALL_FAILED_UPDATE_INCOMPATIBLE\` → \`pm uninstall\` rồi cài sạch."
            echo "Đối chiếu \`sha256sum\` với bản build trước khi tin."
            echo ""
            echo "**3. Chọn lại ngôn ngữ giọng nói → Tiếng Việt** trong Cài đặt của app."
            echo "Mặc định là tiếng Anh; bỏ qua bước này thì mọi câu tiếng Việt sai bét và"
            echo "triệu chứng nhìn y hệt \"mic hỏng\"."
            echo ""
            echo "Chi tiết đầy đủ: \`docs/backend-docs/carsky-runbook.md\` §6, §7."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: lùi lại image cũ nếu node không lên
        # Lùi được thật, vì PATCH đã dùng đúng đường dẫn `/blueprints/nodes/{id}`.
        #
        # ⚠️ Điều kiện phải bám vào `steps.verify.outcome`, KHÔNG phải `failure()`
        # chung chung. Lần chạy 08/08 dùng `failure()`: bước restart fail chỉ vì
        # API trả 500 (dù lệnh đã chạy), rollback liền PATCH đè image cũ lên bản
        # mới vừa ghi thành công. Deploy tự huỷ chính nó.
        #
        # Chỉ lùi khi bước verify kết luận node THẬT SỰ không lên được — đó mới
        # là tình huống đáng đánh đổi để quay về bản cũ.
        if: ${{ always() && !inputs.dry_run && inputs.mode == 'restart' && steps.verify.outcome == 'failure' && steps.current.outputs.old_image != '' }}
        run: |
          set -euo pipefail
          echo "::warning::Lùi node về ${{ steps.current.outputs.old_image }}"
          jq -n --slurpfile c /tmp/config-old.json '{config: $c[0]}' > /tmp/rollback.json
          curl -fsS -X PATCH "$BASE/blueprints/nodes/${{ inputs.node_id }}" \
            -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @/tmp/rollback.json
          # Cũng không `-f`: restart trả 500 nhưng vẫn chạy. Bản 08/08 dùng `-f`
          # ở đây nên rollback báo hỏng dù nó đã lùi image xong xuôi — người đọc
          # log tưởng mất cả đường lùi.
          RC=$(curl -s -o /dev/null -w "%{http_code}" \
               -X POST "$BASE/deployments/${{ inputs.room_id }}/restart/${{ inputs.node_id }}" \
               -H "x-api-key: ${{ secrets.CARSKY_API_KEY }}" -H "Content-Length: 0")
          echo "restart (rollback) tra HTTP $RC"
          {
            echo ""
            echo "### ⚠️ Đã lùi lại"
            echo ""
            echo "Node được trả về \`${{ steps.current.outputs.old_image }}\` và restart."
            echo "⚠️ \`restart\` không đọc lại blueprint, nên **chưa chắc bản cũ đã được áp**."
            echo "Kiểm bằng log \`?container=user\`. Nếu vẫn sai, chạy \`mode=recreate\` với image cũ."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cứu room nếu recreate hỏng giữa chừng
        # Tinh huong te nhat cua ca file nay: DELETE da chay xong, POST that bai
        # hoac deployment moi khong len du node. Room dang TRONG hoac dang o
        # trang thai do dang, va khong ai dang truc.
        #
        # Muc tieu o day KHONG phai cuu ban moi — la dua room ve mot trang thai
        # co the demo duoc. Nen: PATCH image cu, roi dung lai tu blueprint.
        #
        # ⚠️ Cai nay KHONG khoi phuc duoc VM Android. APK va eth1 da mat tu luc
        # DELETE, va khong lenh REST nao lay lai duoc. Van phai lam tay.
        if: ${{ always() && !inputs.dry_run && inputs.mode == 'recreate' && steps.recreate.outcome == 'failure' && steps.current.outputs.old_image != '' }}
        run: |
          set -uo pipefail
          KEY='${{ secrets.CARSKY_API_KEY }}'
          ROOM='${{ inputs.room_id }}'
          BP='${{ steps.current.outputs.blueprint }}'

          echo "::warning::recreate hỏng — lùi blueprint về ${{ steps.current.outputs.old_image }} và dựng lại"
          jq -n --slurpfile c /tmp/config-old.json '{config: $c[0]}' > /tmp/rollback.json
          curl -fsS -X PATCH "$BASE/blueprints/nodes/${{ inputs.node_id }}" \
            -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            --data @/tmp/rollback.json || echo "::warning::PATCH lui that bai"

          # Chi POST khi room that su dang trong. Neu deployment cu van con
          # (DELETE chua an) thi POST them mot cai nua la dam vao quota va co
          # the de lai hai ban ghi tren cung room.
          SC=$(curl -s -o /dev/null -w "%{http_code}" -H "x-api-key: $KEY" "$BASE/deployments/$ROOM/status")
          if [ "$SC" = "404" ]; then
            RC=$(curl -s -o /tmp/rb-post.json -w "%{http_code}" -X POST "$BASE/deployments" \
                 -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                 -d "$(jq -nc --arg b "$BP" --arg r "$ROOM" '{blueprintId:$b, roomId:$r, name:"viva-asr-rollback-${{ github.run_number }}"}')")
            echo "POST (rollback) tra HTTP $RC"; cat /tmp/rb-post.json || true
          else
            echo "Room van con deployment (status http=$SC) — khong POST them."
          fi

          {
            echo ""
            echo "### 🔴 recreate hỏng — đã cố cứu room"
            echo ""
            echo "Blueprint được trả về \`${{ steps.current.outputs.old_image }}\` và dựng lại từ đó."
            echo ""
            echo "**Không khôi phục được VM Android.** APK, cấu hình \`eth1\` và thiết lập"
            echo "trong app đã mất từ lúc \`DELETE\` — phải cài lại tay (runbook §6, §7)."
            echo ""
            echo "Kiểm bằng mắt trước khi coi là xong:"
            echo ""
            echo '```bash'
            echo "curl -fsS -H \"x-api-key: \$KEY\" \"$BASE/deployments/$ROOM/status\""
            echo "curl -fsS -H \"x-api-key: \$KEY\" \"$BASE/deployments/$ROOM/nodes\" | jq -r '.[] | \"\\(.displayName): \\(.phase)\"'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
